<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inventory Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f11;--bg2:#16161a;--bg3:#1e1e24;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#f0f0f4;--text2:#9898a8;--text3:#55555f;
  --cell-bg:#0f0f11;--cell-bg-hover:#16161a;
  --accent:#4ade80;--blue:#93c5fd;--warn:#fcd34d;--red:#fca5a5;--purple:#d8b4fe;--orange:#fdba74;--teal:#67e8f9;
  --inter:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
@media(prefers-color-scheme:light){
  :root{--bg:#fff;--bg2:#f5f5f8;--bg3:#ebebef;--border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);--text:#111118;--text2:#44444f;--text3:#8888a0;--cell-bg:#fff;--cell-bg-hover:#f5f5f8;--accent:#16a34a;--blue:#2563eb;--warn:#d97706;--red:#dc2626;--purple:#7c3aed;--orange:#ea580c;--teal:#0891b2;}
}
body{font-family:var(--inter);background:var(--bg);color:var(--text);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:13px 24px;border-bottom:1px solid var(--border);background:var(--bg);gap:12px;flex-wrap:wrap;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.logo{font-size:14px;font-weight:600;}.logo span{color:var(--accent);}
.tab-bar{display:flex;gap:2px;margin-left:16px;}
.tab-btn{padding:5px 14px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--text3);transition:all .15s;}
#tab-lock.active{background:var(--bg3);border-color:var(--border2);color:var(--text);}
#tab-elmich{color:var(--text3);}
#tab-elmich:hover{color:var(--red);}
#tab-elmich.active{color:var(--red);border-color:var(--red);background:rgba(248,113,113,0.08);}
.dv{width:1px;height:20px;background:var(--border2);}
#last-updated{font-family:var(--mono);font-size:11px;color:var(--text3);}
.topbar-right{display:flex;gap:8px;}
.btn-action{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.btn-action:hover{border-color:var(--accent);color:var(--accent);}
.btn-action.loading{opacity:.4;pointer-events:none;}
.stats-row{flex-shrink:0;display:grid;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.stat-card{background:var(--bg);padding:14px 18px;}
.stat-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;}
.stat-value{font-family:var(--mono);font-size:20px;font-weight:500;}
.c-blue{color:var(--blue);}.c-warn{color:var(--warn);}.c-green{color:var(--accent);}.c-red{color:var(--red);}.c-purple{color:var(--purple);}.c-orange{color:var(--orange);}.c-teal{color:var(--teal);}
.stat-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.toolbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
input[type=text]{background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:var(--inter);font-size:13px;padding:6px 11px;outline:none;transition:border-color .15s;min-width:180px;}
input[type=text]:focus{border-color:var(--blue);}
input[type=text]::placeholder{color:var(--text3);}
.row-count{font-size:12px;color:var(--text3);margin-left:auto;font-family:var(--mono);}
.table-wrap{flex:1;overflow:auto;padding:0 0 24px;}
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%;}
thead th{position:sticky;top:0;z-index:2;background:var(--bg);font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;white-space:nowrap;border-bottom:2px solid var(--border2);text-align:right;}
thead th:first-child{text-align:left;padding-left:24px;position:sticky;left:0;z-index:4;}
thead th:last-child{padding-right:24px;}
tbody td:first-child{position:sticky;left:0;z-index:1;background:var(--cell-bg);box-shadow:2px 0 8px rgba(0,0,0,0.12);}
.th-inner{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end;}
.filter-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;font-size:10px;opacity:0.4;transition:opacity .15s;flex-shrink:0;}
thead th:hover .filter-btn{opacity:0.8;}
.filter-btn.active{opacity:1;color:var(--blue);}
.filter-btn.sort-active{opacity:1;color:var(--accent);font-weight:700;}
.th-1013{color:var(--purple)!important;}.th-others{color:var(--orange)!important;}.th-bn{color:var(--blue)!important;}.th-1003{color:var(--teal)!important;}.th-total{color:var(--warn)!important;}.th-sl{color:var(--accent)!important;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:hover{background:var(--cell-bg-hover);}
tbody tr:hover td:first-child{background:var(--cell-bg-hover)!important;}
tbody tr.row-critical{border-left:2px solid var(--red);}
tbody tr.row-warn{border-left:2px solid var(--warn);}
tbody tr.row-check{border-left:2px solid #f59e0b;background:rgba(251,191,36,.04);}
td{padding:9px 12px;text-align:right;color:var(--text2);white-space:nowrap;}
td:first-child{text-align:left;font-weight:500;color:var(--text);font-family:var(--mono);padding-left:24px;}
td:last-child{padding-right:24px;}
.n{font-family:var(--mono);}.n0{font-family:var(--mono);color:var(--text3);}
.n-1013{font-family:var(--mono);color:var(--purple);}.n-oth{font-family:var(--mono);color:var(--orange);}.n-bn{font-family:var(--mono);color:var(--blue);}.n-1003{font-family:var(--mono);color:var(--teal);}
.n-tot{font-family:var(--mono);color:var(--warn);font-weight:600;}.n-sl{font-family:var(--mono);color:var(--accent);font-weight:600;}.n-sub{font-family:var(--mono);color:#94a3b8;}
.n-red{font-family:var(--mono);color:var(--red);}.n-wrn{font-family:var(--mono);color:var(--warn);}.n-ok{font-family:var(--mono);color:var(--accent);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap;}
.b-crit{background:rgba(220,38,38,.1);color:var(--red);border:1px solid rgba(220,38,38,.2);}
.b-warn{background:rgba(217,119,6,.1);color:var(--warn);border:1px solid rgba(217,119,6,.2);}
.b-ok{background:rgba(22,163,74,.08);color:var(--accent);border:1px solid rgba(22,163,74,.18);}
.b-zero{background:rgba(128,128,128,.08);color:var(--text3);border:1px solid var(--border2);}
.b-check{background:rgba(251,191,36,.12);color:#f59e0b;border:1px solid rgba(251,191,36,.3);}
.empty-state{text-align:center;padding:80px 0;color:var(--text3);font-size:14px;}
.empty-state .big{font-size:36px;margin-bottom:12px;}
.more-row td{text-align:center!important;color:var(--text3);font-size:12px;padding:14px;}
.footnote{flex-shrink:0;font-size:11px;color:var(--text3);padding:8px 24px;border-top:1px solid var(--border);background:var(--bg2);}
.filter-panel{position:fixed;z-index:1000;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,0.4);min-width:220px;max-width:280px;display:none;overflow:hidden;}
.filter-panel.open{display:flex;flex-direction:column;}
.fp-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px;border-bottom:1px solid var(--border);}
.fp-head span{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.fp-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;}
.fp-search-wrap{padding:8px 10px 4px;}
.fp-search{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--inter);font-size:12px;padding:5px 9px;outline:none;}
.fp-search:focus{border-color:var(--blue);}
.fp-search::placeholder{color:var(--text3);}
.fp-actions{display:flex;gap:6px;padding:4px 10px;align-items:center;}
.fp-act{font-size:11px;color:var(--blue);background:none;border:none;cursor:pointer;padding:2px 6px;opacity:.8;border-radius:4px;}
.fp-act:hover{opacity:1;}
.fp-act.active{opacity:1;background:rgba(96,165,250,.15);font-weight:600;}
.fp-list{max-height:220px;overflow-y:auto;padding:4px 0;}
.fp-item{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;transition:background .1s;}
.fp-item:hover{background:var(--bg3);}
.fp-item input[type=checkbox]{accent-color:var(--blue);width:13px;height:13px;cursor:pointer;}
.fp-item label{font-family:var(--mono);font-size:12px;color:var(--text2);cursor:pointer;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fp-item-count{font-family:var(--mono);font-size:10px;color:var(--text3);}
.fp-footer{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);}
.fp-btn-clear{flex:1;padding:6px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text3);font-size:12px;cursor:pointer;}
.fp-btn-clear:hover{border-color:var(--red);color:var(--red);}
.fp-btn-apply{flex:1;padding:6px;border-radius:6px;border:none;background:var(--blue);color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{display:inline-block;animation:spin .8s linear infinite;}
</style>
</head>

<div class="footnote">
  Tot: le 1 thang &nbsp;| Binh thuong: 1-3 thang &nbsp;| Can day: gt 3 thang hoac SL=0 &nbsp;|
  Thoi gian ban het Ton = (Ton hien tai + Hang duong + FBS) / Tong SL 1 thang
</div>

<script>
var SUPABASE_URL2 = SUPABASE_URL;
var SUPABASE_KEY2 = SUPABASE_KEY;
var currentTab = "lock";
var D = [];
var CF = {};
var activeCol = null;
var pendingChecks = {};
var listSortDir = {};
var activeSortCol = null;
var activeSortDir = "asc";

var STATUS_LABEL = {critical:"Can day",warn:"Binh thuong",ok:"Tot",zero:"Het hang",check:"Check"};
var BADGE = {
  critical:'<span class="badge b-crit">&#128308; Can day</span>',
  warn:'<span class="badge b-warn">&#128993; Binh thuong</span>',
  ok:'<span class="badge b-ok">&#10003; Tot</span>',
  zero:'<span class="badge b-zero">Het hang</span>',
  check:'<span class="badge b-check">&#9888; Check</span>'
};

function n(v){var x=parseFloat(v);return isNaN(x)?0:x;}
function cn(v,cls){var x=n(v);if(x===0)return'<span class="n0">0</span>';return'<span class="'+cls+'">'+Math.round(x).toLocaleString("vi-VN")+'</span>';}
function cnTot(v){var x=n(v);if(x<0)return'<span style="font-family:var(--mono);color:var(--red);font-weight:600;">'+Math.round(x).toLocaleString("vi-VN")+' !</span>';if(x===0)return'<span class="n0">0</span>';return'<span class="n-tot">'+Math.round(x).toLocaleString("vi-VN")+'</span>';}
function cd(v){var x=n(v);if(x===0)return'<span class="n0">-</span>';return'<span class="n">'+x.toFixed(1)+'</span>';}

function getFBS(r){return n(currentTab==="lock"?r.ton_fbs:r.fbs);}

function banHet(r){
  var t2c=n(r.ton_hien_tai)+n(r.hang_di_duong)+getFBS(r);
  if(t2c<=0)return null;
  var sl=n(r.tong_sl_thang);
  if(sl<=0)return Infinity;
  return t2c/sl;
}

function getStatus(r){
  if(n(r.tong_ton_va_duong)<0)return"check";
  var t2c=n(r.ton_hien_tai)+n(r.hang_di_duong)+getFBS(r);
  if(t2c<=0)return"zero";
  var bh=banHet(r);
  if(bh===Infinity||bh>3)return"critical";
  if(bh>1)return"warn";
  return"ok";
}

function cbh(r){
  if(n(r.tong_ton_va_duong)<0)return'<span style="color:var(--red);font-family:var(--mono);">Am</span>';
  var t2c=n(r.ton_hien_tai)+n(r.hang_di_duong)+getFBS(r);
  if(t2c<=0)return'<span class="n0">-</span>';
  var bh=banHet(r);
  if(bh===Infinity)return'<span class="n0">-</span>';
  if(bh<=1)return'<span class="n-ok">'+bh.toFixed(2)+'</span>';
  if(bh<=3)return'<span class="n-wrn">'+bh.toFixed(2)+'</span>';
  return'<span class="n-red">'+bh.toFixed(2)+'</span>';
}

function switchTab(tab){
  if(currentTab===tab)return;
  currentTab=tab;D=[];CF={};activeCol=null;pendingChecks={};listSortDir={};activeSortCol=null;activeSortDir="asc";
  document.getElementById("tab-lock").classList.toggle("active",tab==="lock");
  document.getElementById("tab-elmich").classList.toggle("active",tab==="elmich");
  buildStatsRow();buildThead();loadData();
}

function buildStatsRow(){
  var el=document.getElementById("stats-row");
  if(currentTab==="lock"){
    el.style.gridTemplateColumns="repeat(8,1fr)";
    el.innerHTML='<div class="stat-card"><div class="stat-label">Tong SKU</div><div class="stat-value" id="s-total">-</div></div>'+
    '<div class="stat-card"><div class="stat-label">Ton kho 1013</div><div class="stat-value c-purple" id="s-1013">-</div><div class="stat-sub" id="s-1013s"></div></div>'+
    '<div class="stat-card"><div class="stat-label">Ton kho Others</div><div class="stat-value c-orange" id="s-oth">-</div><div class="stat-sub" id="s-oths"></div></div>'+
    '<div class="stat-card"><div class="stat-label">Ton kho BN</div><div class="stat-value c-blue" id="s-bn">-</div><div class="stat-sub" id="s-bns"></div></div>'+
    '<div class="stat-card"><div class="stat-label">Ton kho 1003</div><div class="stat-value c-teal" id="s-1003">-</div><div class="stat-sub" id="s-1003s"></div></div>'+
    '<div class="stat-card"><div class="stat-label">Can day >3 thang</div><div class="stat-value c-red" id="s-crit">-</div><div class="stat-sub">Ton cao, ban cham</div></div>'+
    '<div class="stat-card"><div class="stat-label">Binh thuong 1-3 thang</div><div class="stat-value c-warn" id="s-warn">-</div><div class="stat-sub">Dang on</div></div>'+
    '<div class="stat-card"><div class="stat-label">Tot le 1 thang</div><div class="stat-value c-green" id="s-ok">-</div><div class="stat-sub">Ban nhanh</div></div>';
  } else {
    el.style.gridTemplateColumns="repeat(5,1fr)";
    el.innerHTML='<div class="stat-card"><div class="stat-label">Tong SKU</div><div class="stat-value" id="s-total">-</div></div>'+
    '<div class="stat-card"><div class="stat-label">Ton kho Elmich</div><div class="stat-value c-purple" id="s-tonkho">-</div><div class="stat-sub" id="s-tonkho-s"></div></div>'+
    '<div class="stat-card"><div class="stat-label">Can day >3 thang</div><div class="stat-value c-red" id="s-crit">-</div><div class="stat-sub">Ton cao, ban cham</div></div>'+
    '<div class="stat-card"><div class="stat-label">Binh thuong 1-3 thang</div><div class="stat-value c-warn" id="s-warn">-</div><div class="stat-sub">Dang on</div></div>'+
    '<div class="stat-card"><div class="stat-label">Tot le 1 thang</div><div class="stat-value c-green" id="s-ok">-</div><div class="stat-sub">Ban nhanh</div></div>';
  }
}

function updateStats(){
  function f(fn){return D.filter(fn).length;}
  function s(fn){return D.reduce(function(a,r){return a+n(fn(r));},0);}
  document.getElementById("s-total").textContent=D.length.toLocaleString("vi-VN");
  document.getElementById("s-crit").textContent=f(function(r){return getStatus(r)==="critical";}).toLocaleString("vi-VN");
  document.getElementById("s-warn").textContent=f(function(r){return getStatus(r)==="warn";}).toLocaleString("vi-VN");
  document.getElementById("s-ok").textContent=f(function(r){return getStatus(r)==="ok";}).toLocaleString("vi-VN");
  if(currentTab==="lock"){
    document.getElementById("s-1013").textContent=s(function(r){return r.ton_1013;}).toLocaleString("vi-VN");
    document.getElementById("s-oth").textContent=s(function(r){return r.ton_others;}).toLocaleString("vi-VN");
    document.getElementById("s-bn").textContent=s(function(r){return r.ton_bn;}).toLocaleString("vi-VN");
    document.getElementById("s-1003").textContent=s(function(r){return r.ton_1003;}).toLocaleString("vi-VN");
    document.getElementById("s-1013s").textContent=f(function(r){return n(r.ton_1013)>0;}).toLocaleString("vi-VN")+" SKU co hang";
    document.getElementById("s-oths").textContent=f(function(r){return n(r.ton_others)>0;}).toLocaleString("vi-VN")+" SKU co hang";
    document.getElementById("s-bns").textContent=f(function(r){return n(r.ton_bn)>0;}).toLocaleString("vi-VN")+" SKU co hang";
    document.getElementById("s-1003s").textContent=f(function(r){return n(r.ton_1003)>0;}).toLocaleString("vi-VN")+" SKU co hang";
  } else {
    document.getElementById("s-tonkho").textContent=s(function(r){return r.ton_kho;}).toLocaleString("vi-VN");
    document.getElementById("s-tonkho-s").textContent=f(function(r){return n(r.ton_kho)>0;}).toLocaleString("vi-VN")+" SKU co hang";
  }
}

var LOCK_COLS = [
  {col:"sku",type:"text",label:"SKU",cls:"",w:130,left:true},
  {col:"ton_1013",type:"num",label:"Ton kho 1013",cls:"th-1013",w:100},
  {col:"ton_others",type:"num",label:"Ton kho Khac (Others)",cls:"th-others",w:140},
  {col:"ton_bn",type:"num",label:"Ton kho BN",cls:"th-bn",w:100},
  {col:"ton_1003",type:"num",label:"Ton kho 1003",cls:"th-1003",w:100},
  {col:"tong_ton_va_duong",type:"num",label:"Tong Ton + Hang di duong",cls:"th-total",w:170},
  {col:"ton_hien_tai",type:"num",label:"Ton kho hien tai",cls:"",w:130,sub:true},
  {col:"hang_di_duong",type:"num",label:"Hang di duong",cls:"",w:120,sub:true},
  {col:"ton_fbs",type:"num",label:"Ton FBS",cls:"",w:110,sub:true},

function buildThead(){
  var tr=document.getElementById("thead-row");
  var cols=currentTab==="lock"?LOCK_COLS:ELMICH_COLS;
  tr.innerHTML=cols.map(function(c){
    var style="min-width:"+c.w+"px;"+(c.last?"padding-right:24px;":"")+(c.left?"text-align:left;":"");
    var color=c.sub?"color:#94a3b8;":"";
    var innerStyle=color+(c.left?"justify-content:flex-start;":"");
    return'<th data-col="'+c.col+'" data-type="'+c.type+'" class="'+c.cls+'" style="'+style+'">'+
      '<div class="th-inner" style="'+innerStyle+'">'+c.label+' <span class="filter-btn" id="fb-'+c.col+'">v</span></div></th>';
  }).join("");
  tr.addEventListener("click",function(e){
    var btn=e.target.closest(".filter-btn");
    if(!btn)return;
    e.stopPropagation();
    var th=btn.closest("th");
    openPanel(th.dataset.col,th.dataset.type,btn);
  });
}

async function fetchAll(){
  var table=currentTab==="lock"?"inventory":"inventory_elmich";
  var h={"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY};
  var all=[],from=0;
  while(true){
    var r=await fetch(SUPABASE_URL+"/rest/v1/"+table+"?select=*&order=sku.asc&offset="+from+"&limit=1000",{headers:h});
    if(!r.ok)throw new Error(table+" "+r.status);
    var p=await r.json();all=all.concat(p);
    if(p.length<1000)break;from+=1000;
  }
  return all;
}

async function loadData(){
  var btn=document.getElementById("btn-refresh"),ri=document.getElementById("ri");
  btn.classList.add("loading");ri.classList.add("spin");
  try{
    D=await fetchAll();
    var lat=D.reduce(function(m,r){return r.updated_at>m?r.updated_at:m;},"");
    var dt=lat?new Date(lat).toLocaleString("vi-VN"):"-";
    document.getElementById("last-updated").textContent="Cap nhat: "+dt+" - "+D.length.toLocaleString("vi-VN")+" SKU";
    updateStats();updateAllFilterBtnSortIndicators();renderTable();
  }catch(e){
    document.getElementById("last-updated").textContent="Loi: "+e.message;
    document.getElementById("tbody").innerHTML='<tr><td colspan="20"><div class="empty-state"><div class="big">!</div>'+e.message+'</div></td></tr>';
  }finally{btn.classList.remove("loading");ri.classList.remove("spin");ri.textContent="R";}
}

function getDisplayVal(col,r){
  if(col==="status")return STATUS_LABEL[getStatus(r)];
  if(col==="ban_het"){var bh=banHet(r);if(bh===null)return"Het hang";if(bh===Infinity)return"-";return String(Math.round(bh*100)/100);}
  if(col==="sku")return r.sku;
  var x=n(r[col]);return x===0?"0":Math.round(x).toLocaleString("vi-VN");
}

function renderTable(){
  var search=document.getElementById("search-sku").value.toLowerCase().trim();
  var data=D.filter(function(r){
    if(search&&!r.sku.toLowerCase().includes(search))return false;
    for(var col in CF){
      var val=CF[col];if(!val)continue;
      if(val instanceof Set&&!val.has(getDisplayVal(col,r)))return false;
    }
    return true;
  });
  var sc=activeSortCol||"ban_het",sd=activeSortDir||"asc";
  data.sort(function(a,b){
    if(sc==="ban_het"){
      var ba=banHet(a),bb=banHet(b),dir=sd==="asc"?1:-1;
      if(ba===null&&bb===null)return 0;if(ba===null)return 1;if(bb===null)return -1;
      if(ba===Infinity&&bb===Infinity)return 0;if(ba===Infinity)return dir;if(bb===Infinity)return -dir;
      return(ba-bb)*dir;
    }
    if(sc==="sku")return sd==="asc"?a.sku.localeCompare(b.sku):b.sku.localeCompare(a.sku);
    return sd==="asc"?n(a[sc])-n(b[sc]):n(b[sc])-n(a[sc]);
  });
  document.getElementById("row-count").textContent=data.length.toLocaleString("vi-VN")+" SKU";
  var tbody=document.getElementById("tbody");
  if(!data.length){tbody.innerHTML='<tr><td colspan="20"><div class="empty-state"><div class="big">?</div>Khong tim thay SKU nao</div></td></tr>';return;}
  var nc=currentTab==="lock"?17:14;
  tbody.innerHTML=data.slice(0,500).map(function(r){
    var s=getStatus(r),cls=s==="critical"?"row-critical":s==="warn"?"row-warn":s==="check"?"row-check":"";
    var row;
    if(currentTab==="lock"){
      row='<td>'+r.sku+'</td>'+
        '<td>'+cn(r.ton_1013,"n-1013")+'</td>'+
        '<td>'+cn(r.ton_others,"n-oth")+'</td>'+
        '<td>'+cn(r.ton_bn,"n-bn")+'</td>'+
        '<td>'+cn(r.ton_1003,"n-1003")+'</td>'+
        '<td>'+cnTot(r.tong_ton_va_duong)+'</td>'+
        '<td>'+cn(r.ton_hien_tai,"n-sub")+'</td>'+
        '<td>'+cn(r.hang_di_duong,"n-sub")+'</td>'+
        '<td>'+cn(r.ton_fbs,"n-sub")+'</td>'+
        '<td>'+cn(r.tong_sl_thang,"n-sl")+'</td>'+
        '<td>'+cn(r.sl_shopee,"n")+'</td>'+
        '<td>'+cn(r.sl_tiktok,"n")+'</td>'+
        '<td>'+cn(r.sl_si,"n")+'</td>'+
        '<td>'+cd(r.avg_sl_thang)+'</td>'+
        '<td>'+cn(r.tong_sl_ban,"n")+'</td>'+
        '<td>'+cbh(r)+'</td>'+
        '<td>'+BADGE[s]+'</td>';
    } else {
      row='<td>'+r.sku+'</td>'+
        '<td>'+cn(r.ton_kho,"n-1013")+'</td>'+
        '<td>'+cnTot(r.tong_ton_va_duong)+'</td>'+
        '<td>'+cn(r.ton_hien_tai,"n-sub")+'</td>'+
        '<td>'+cn(r.hang_di_duong,"n-sub")+'</td>'+
        '<td>'+cn(r.fbs,"n-sub")+'</td>'+
        '<td>'+cn(r.tong_sl_thang,"n-sl")+'</td>'+
        '<td>'+cn(r.sl_shopee,"n")+'</td>'+
        '<td>'+cn(r.sl_tiktok,"n")+'</td>'+
        '<td>'+cn(r.sl_si,"n")+'</td>'+
        '<td>'+cd(r.avg_sl_thang)+'</td>'+
        '<td>'+cn(r.tong_sl_ban,"n")+'</td>'+
        '<td>'+cbh(r)+'</td>'+
        '<td>'+BADGE[s]+'</td>';
    }
    return'<tr class="'+cls+'">'+row+'</tr>';
  }).join("")+(data.length>500?'<tr class="more-row"><td colspan="'+nc+'">Hien thi 500/'+data.length.toLocaleString("vi-VN")+' SKU</td></tr>':"");
}

function exportData(){
  var search=document.getElementById("search-sku").value.toLowerCase().trim();
  var data=D.filter(function(r){
    if(search&&!r.sku.toLowerCase().includes(search))return false;
    for(var col in CF){var val=CF[col];if(!val)continue;if(val instanceof Set&&!val.has(getDisplayVal(col,r)))return false;}
    return true;
  });
  var bhl=function(r){var bh=banHet(r);if(bh===null)return"Het hang";if(bh===Infinity)return"";return Math.round(bh*100)/100;};
  var stl=function(r){return{critical:"Can day",warn:"Binh thuong",ok:"Tot",zero:"Het hang",check:"Check"}[getStatus(r)];};
  var rows;
  if(currentTab==="lock"){
    rows=data.map(function(r){return{"SKU":r.sku,"Ton kho 1013":n(r.ton_1013),"Ton kho Others":n(r.ton_others),"Ton kho BN":n(r.ton_bn),"Ton kho 1003":n(r.ton_1003),"Tong Ton+Duong":n(r.tong_ton_va_duong),"Ton hien tai":n(r.ton_hien_tai),"Hang duong":n(r.hang_di_duong),"Ton FBS":n(r.ton_fbs),"Tong SL thang":n(r.tong_sl_thang),"Shopee":n(r.sl_shopee),"Tiktok":n(r.sl_tiktok),"Si":n(r.sl_si),"AVG":n(r.avg_sl_thang),"Tong SL ban":n(r.tong_sl_ban),"Ban het":bhl(r),"Trang thai":stl(r)};});
  } else {
    rows=data.map(function(r){return{"SKU":r.sku,"Ton kho":n(r.ton_kho),"Tong Ton+Duong":n(r.tong_ton_va_duong),"Ton hien tai":n(r.ton_hien_tai),"Hang duong":n(r.hang_di_duong),"FBS":n(r.fbs),"Tong SL thang":n(r.tong_sl_thang),"Shopee":n(r.sl_shopee),"Tiktok":n(r.sl_tiktok),"Si":n(r.sl_si),"AVG":n(r.avg_sl_thang),"Tong SL ban":n(r.tong_sl_ban),"Ban het":bhl(r),"Trang thai":stl(r)};});
  }
  var ws=XLSX.utils.json_to_sheet(rows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,currentTab==="lock"?"Lock":"Elmich");
  var ts=new Date().toISOString().slice(0,19).replace(/[-:T]/g,"");
  XLSX.writeFile(wb,"Inventory_"+currentTab+"_"+ts+".xlsx");
}

function getUniqueVals(col){
  var vals={};
  D.forEach(function(r){
    var v=getDisplayVal(col,r);
    vals[v]=(vals[v]||0)+1;
  });
  var dir=listSortDir[col];
  var entries=Object.entries(vals);
  function sorter(a,b){var na=parseFloat(a[0].replace(/[^0-9.-]/g,"")),nb=parseFloat(b[0].replace(/[^0-9.-]/g,""));if(!isNaN(na)&&!isNaN(nb))return na-nb;return a[0].localeCompare(b[0]);}
  if(dir==="desc")return entries.sort(function(a,b){return-sorter(a,b);});
  return entries.sort(sorter);
}

function renderChecklist(){
  var search=document.getElementById("fp-search").value.toLowerCase();
  var list=document.getElementById("fp-list");
  var vals=getUniqueVals(activeCol);
  var selected=pendingChecks[activeCol]||new Set();
  list.innerHTML="";
  vals.filter(function(v){return!search||v[0].toLowerCase().includes(search);}).forEach(function(entry){
    var v=entry[0],cnt=entry[1];
    var chk=selected.size===0||selected.has(v);
    var div=document.createElement("div");div.className="fp-item";
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=chk;
    cb.addEventListener("change",function(){toggleCheck(v,cb.checked);});
    var lbl=document.createElement("label");lbl.textContent=v;
    var sp=document.createElement("span");sp.className="fp-item-count";sp.textContent=cnt;
    div.appendChild(cb);div.appendChild(lbl);div.appendChild(sp);list.appendChild(div);
  });
}

function toggleCheck(val,checked){if(!pendingChecks[activeCol])pendingChecks[activeCol]=new Set();if(checked)pendingChecks[activeCol].add(val);else pendingChecks[activeCol].delete(val);}
function checkAll(){pendingChecks[activeCol]=new Set();renderChecklist();}
function uncheckAll(){document.getElementById("fp-list").querySelectorAll("input").forEach(function(c){c.checked=false;});}

function applyChecklist(){
  var s=pendingChecks[activeCol];
  if(!s||s.size===0){delete CF[activeCol];}
  else{var total=getUniqueVals(activeCol).length;if(s.size>=total)delete CF[activeCol];else CF[activeCol]=new Set(s);}
  updateFilterBtns();renderTable();closePanel();
}

function setListSort(dir){
  if(listSortDir[activeCol]===dir)dir=null;
  listSortDir[activeCol]=dir;
  updateSortBtns();renderChecklist();
  if(dir){activeSortCol=activeCol;activeSortDir=dir;}
  else if(activeSortCol===activeCol){activeSortCol=null;activeSortDir="asc";}
  updateAllFilterBtnSortIndicators();
}

function updateSortBtns(){
  var dir=listSortDir[activeCol];
  document.getElementById("fp-sort-az").classList.toggle("active",dir==="asc");
  document.getElementById("fp-sort-za").classList.toggle("active",dir==="desc");
}

function openPanel(col,type,btn){
  if(activeCol===col){closePanel();return;}
  activeCol=col;
  var panel=document.getElementById("filter-panel");
  var th=document.querySelector('[data-col="'+col+'"]');
  document.getElementById("fp-label").textContent=th?th.innerText.replace(/[vAZ-]/g,"").trim():col;
  document.getElementById("fp-search").value="";
  if(CF[col] instanceof Set)pendingChecks[col]=new Set(CF[col]);else pendingChecks[col]=new Set();
  updateSortBtns();renderChecklist();
  var rect=btn.getBoundingClientRect();
  panel.style.top=(rect.bottom+6)+"px";
  panel.style.left=Math.min(rect.left,window.innerWidth-240)+"px";
  panel.classList.add("open");
  document.getElementById("fp-search").focus();
}

function closePanel(){document.getElementById("filter-panel").classList.remove("open");activeCol=null;updateFilterBtns();}
function clearColFilter(){delete CF[activeCol];delete pendingChecks[activeCol];updateFilterBtns();renderTable();closePanel();}

function updateFilterBtns(){
  document.querySelectorAll(".filter-btn").forEach(function(btn){
    var th=btn.closest("th");if(!th)return;
    var col=th.dataset.col;
    if(col&&CF[col] instanceof Set&&CF[col].size>0)btn.classList.add("active");
    else btn.classList.remove("active");
  });
}

function updateAllFilterBtnSortIndicators(){
  document.querySelectorAll("th[data-col]").forEach(function(th){
    var btn=th.querySelector(".filter-btn");if(!btn)return;
    if(th.dataset.col===activeSortCol){btn.textContent=activeSortDir==="asc"?"^":"v";btn.classList.add("sort-active");}
    else{btn.textContent="v";btn.classList.remove("sort-active");}
  });
}

function handleOutsideClick(e){if(!e.target.closest(".filter-panel")&&!e.target.closest(".filter-btn"))closePanel();}

buildStatsRow();
buildThead();
loadData();
</script>
